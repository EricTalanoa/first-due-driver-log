name: iOS app

on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: ios

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Tool versions
        run: echo "::notice::$(xcodebuild -version | tr '\n' ' ') / macOS $(sw_vers -productVersion)"
      - name: Core tests (macOS)
        # The app target is iOS-only (#if os(iOS)), so this builds and tests the core logic on macOS.
        run: ci/run.sh swift test
      - name: Build app (iOS device SDK, unsigned)
        run: ci/run.sh xcodebuild build -scheme DriverLog -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO -skipPackagePluginValidation -skipMacroValidation

  ui-tests:
    # The newest iOS on the runner, and the oldest the app supports (deploymentTarget 17.0).
    name: ui-tests (${{ matrix.ios }})
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        ios: [newest, "17.5"]
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Simulator tap-through tests
        run: ci/run.sh ci/uitests.sh
        env:
          IOS: ${{ matrix.ios != 'newest' && matrix.ios || '' }}

  screenshots:
    runs-on: macos-latest
    permissions:
      contents: write
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Simulator screenshots
        run: ci/run.sh ci/screenshots.sh
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: ios-screenshots
          path: ios/ci-shots/*.png
      - name: Publish to the ios-screenshots branch (ios-screenshots-pr for pull requests)
        working-directory: .
        run: |
          # Pull requests publish separately so a run on main can't replace a PR's screens before they're reviewed.
          BRANCH=ios-screenshots${{ github.event_name == 'pull_request' && '-pr' || '' }}
          SHA=$(git rev-parse --short ${{ github.event.pull_request.head.sha || 'HEAD' }} 2>/dev/null || git rev-parse --short HEAD)
          mkdir /tmp/shots && cp ios/ci-shots/*.png /tmp/shots/
          git config user.name "driver-log-ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout --orphan "$BRANCH"
          git rm -rfq .
          cp /tmp/shots/*.png .
          echo "iOS screens from $SHA" > README.md
          git add *.png README.md
          git commit -qm "iOS screenshots for $SHA"
          git push -f origin "$BRANCH"
