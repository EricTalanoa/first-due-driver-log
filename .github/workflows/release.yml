name: iOS release (TestFlight)

# Run by hand: GitHub → Actions → "iOS release (TestFlight)" → Run workflow.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version shown in the App Store (e.g. 1.0)"
        required: true
        default: "1.0"

defaults:
  run:
    working-directory: ios

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Archive, sign and upload to TestFlight
        run: ci/run.sh ci/release.sh
        env:
          VERSION: ${{ inputs.version }}
          BUILD: ${{ github.run_number }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
