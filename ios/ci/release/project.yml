# The App Store build of the app (bundle ID com.erictalanoa.FirstDueDriverLog), generated by ci/release.sh.
# Same code as on your phone with xtool: the app's @main is in the DriverLog package; this target links it.
name: DriverLogRelease
options:
  bundleIdPrefix: com.erictalanoa
packages:
  DriverLog:
    path: ../..
targets:
  FirstDueDriverLog:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources: [../host/Host.swift, Assets.xcassets]
    dependencies:
      - package: DriverLog
        product: DriverLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.erictalanoa.FirstDueDriverLog
        PRODUCT_NAME: Driver Log
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: ../../App.entitlements
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
