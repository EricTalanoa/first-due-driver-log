[build]
  command = "npm run build:netlify"
  publish = "netlify-dist"
[dev]
  command = "node node_modules/vite/bin/vite.js --config vite.netlify.config.ts --host 127.0.0.1 --port 5174"
  targetPort = 5174
  port = 8888
  framework = "#custom"
  autoLaunch = false
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"
    X-Robots-Tag = "noindex, nofollow"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://jtofziwssarbifugqjnn.supabase.co wss://jtofziwssarbifugqjnn.supabase.co; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
